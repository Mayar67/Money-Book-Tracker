<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر فلوسي</title>
<meta name="description" content="دفتر شخصي لتسجيل المصروف والدخل والحوشة، بيحسب اليوم والأسبوع والشهر.">
<meta name="theme-color" content="#1F2433">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر فلوسي">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>
<style>
/* Layout: a pocket app — five screens (Add, Month, Money, Plans, Log) behind a bottom tab bar; header carries month, language and colors. */
/* Dark-only by choice, lifted off black, low-saturation for calm. Four palettes mixing burgundy and blues; default is navy + burgundy. */
:root{
  --bg:#1F2433; --paper:#282E40; --ink:#ECEAF0; --muted:#A6A9BB; --line:#3A4157; --soft:#31374B;
  --accent:#CF8A9A; --accent-soft:#4A2F3B;
  --out:#E39A86; --out-soft:#4A3030; --in:#8CC7A8; --in-soft:#273E35; --save:#94B4DE; --save-soft:#2C3A52;
  --give:#D9B98A; --give-soft:#463D2C;
  color-scheme:dark;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-pal="wine"]{
  --bg:#2A1F25; --paper:#33262D; --ink:#F1E7EA; --muted:#BBA5AC; --line:#4B3941; --soft:#3E2F36;
  --accent:#D88F9F; --accent-soft:#55303C; --save:#9DB7DC; --save-soft:#323A4D}
:root[data-pal="slate"]{
  --bg:#1E252D; --paper:#272F39; --ink:#E7ECF1; --muted:#A1ACB8; --line:#38434F; --soft:#303A45;
  --accent:#8FB3D4; --accent-soft:#2E4256; --save:#D3949F; --save-soft:#4A3038}
:root[data-pal="dusk"]{
  --bg:#221F2D; --paper:#2B2838; --ink:#ECE9F3; --muted:#AAA5BD; --line:#3F3A52; --soft:#353145;
  --accent:#A7B3E3; --accent-soft:#363D5E; --save:#D08A9B; --save-soft:#4A2E3A}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
.app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
main{display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem}
h2{font-family:var(--f-display);font-weight:500;font-size:1.12rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px}
.brand{min-width:0}
.status{font-size:.78rem;color:var(--muted)}
.hbtns{display:flex;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:500}
.chipbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.pals{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pals button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.pals button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
.monthnav{flex:1 1 100%;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.monthnav button{border:0;background:transparent;width:40px;height:36px;border-radius:8px;font-size:1.2rem}
.monthnav button:hover{background:var(--soft)}
.monthnav b{text-align:center;font-weight:600}

/* tab bar */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--paper);border-top:1px solid var(--line);
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.74rem;font-weight:500;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab.add[aria-current="page"]{color:var(--paper);background:var(--accent)}
.auth{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding-block:calc(36px + env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authcard{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.authcard form{display:flex;flex-direction:column;gap:12px}
.authcard .btn{width:100%;padding:13px}
.authmsg{font-size:.86rem;color:var(--out);min-height:1.2em}
.authnote{font-size:.84rem;color:var(--muted);line-height:1.7}
.profs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.profs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.85rem}
.linkbtn{border:0;background:transparent;color:var(--accent);font-size:.84rem;padding:4px 0;text-decoration:underline;align-self:flex-start}
.linkbtn.danger{color:var(--out)}
#bkText{flex:1 1 100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;font-family:var(--f-num);font-size:12px;direction:ltr}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:.88rem;font-weight:500;max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--out);color:var(--bg)}

/* today card */
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.today .wb .v{font-size:1.25rem}

/* entry slip */
.slip{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:.92rem}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg input[value="expense"]:checked+span{background:var(--out-soft);border-color:var(--out);color:var(--out)}
.seg input[value="income"]:checked+span,.seg input[value="lent"]:checked+span{background:var(--in-soft);border-color:var(--in);color:var(--in)}
.seg input[value="borrowed"]:checked+span,.seg input[value="bank"]:checked+span{background:var(--out-soft);border-color:var(--out);color:var(--out)}
.seg input[value="save"]:checked+span,.seg input[value="withdraw"]:checked+span{background:var(--save-soft);border-color:var(--save);color:var(--save)}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:640px){.row{grid-template-columns:1fr 1fr}.row .amt{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;min-width:0}
.amt input{font-family:var(--f-num);font-size:1.4rem;font-weight:600;direction:ltr;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 11px;font-size:.88rem}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:600;background:var(--accent);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* summary */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:.8rem;color:var(--muted)}
.tile .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:600;direction:ltr;overflow-wrap:anywhere}
.tile .s{font-size:.76rem;color:var(--muted)}
.tile.out .v{color:var(--out)} .tile.in .v{color:var(--in)} .tile.sv .v{color:var(--save)}
.cur{font-size:.7em;color:var(--muted);font-weight:500;margin-inline-start:4px}
[dir="rtl"] .tile .v,[dir="rtl"] .wb .v{text-align:right}
[dir="ltr"] .tile .v,[dir="ltr"] .wb .v{text-align:left}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

.verdict{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.pill.ok{background:var(--in-soft);color:var(--in)} .pill.mid{background:var(--accent-soft);color:var(--accent)} .pill.hi{background:var(--out-soft);color:var(--out)}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:520px;height:auto}
.daypick{font-size:.88rem;min-height:1.5em}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.88rem}
.stats b{font-family:var(--f-num);font-weight:600}

.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,9rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;border-radius:5px;background:var(--out)}
.bar .fill.wk{background:var(--accent)}
.bar .amt2{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;min-width:5.5rem}
[dir="rtl"] .bar .amt2{text-align:left} [dir="ltr"] .bar .amt2{text-align:right}
.wkdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wkd{background:var(--bg);border-radius:8px;padding:8px 2px;text-align:center;font-size:.76rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.wkd b{font-family:var(--f-num);font-size:.82rem;font-weight:600}
.wkd.top{background:var(--out-soft);color:var(--out)}

.goal{display:flex;flex-direction:column;gap:8px}
.fixed{display:flex;flex-direction:column;gap:6px}
.fx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.9rem}
.fx .t{font-weight:600}
.fx .sub{font-size:.8rem;color:var(--muted)}
.fx.todo{background:var(--accent-soft)}
.fx button{border:0;border-radius:9px;padding:7px 13px;font-weight:600;background:var(--accent);color:var(--paper);font-size:.85rem}
.gtrack{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.gfill{height:100%;background:var(--save);border-radius:7px}
.gfill.give{background:var(--give)}
.goalform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.goalform .field{flex:1 1 140px}
.srcs{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.srcs h3{font-size:.95rem;font-weight:600}
.srcrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.srcrow .t{font-weight:600}
.srcrow .sub{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.srcrow button{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:5px 12px;font-size:.82rem}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem;flex:1 1 100%}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.unitrow{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;flex:1 1 100%}
.unitrow .field{flex:1 1 110px}
.unitrow button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:9px 12px}
#unitsWrap{display:contents}

/* wishes + debts */
.wbudget{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.wbudget{grid-template-columns:1fr}}
.wb{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wb .k{font-size:.78rem;color:var(--muted)}
.wb .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.15rem;font-weight:600;direction:ltr}
.wb .s{font-size:.74rem;color:var(--muted)}
.witem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 4px;border-top:1px solid var(--line)}
.witem:first-child{border-top:0}
.witem .c{font-weight:600}
.witem .n{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.witem .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;font-weight:600}
.witem .ops{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.witem .ops button{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.82rem;padding:6px 11px;border-radius:8px}
.witem .ops button.buy{color:var(--in);border-color:var(--in)}
.witem .ops button.sure{background:var(--out);border-color:var(--out);color:var(--paper)}
.witem .ops button.sure.buy{background:var(--in);border-color:var(--in)}
.wv{font-size:.84rem;font-weight:600}
.wv.ok{color:var(--in)} .wv.mid{color:var(--accent)} .wv.hi{color:var(--out)}
.prio{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:1px}
.prio.p0{background:var(--out-soft);color:var(--out)} .prio.p1{background:var(--accent-soft);color:var(--accent)} .prio.p2{background:var(--soft);color:var(--muted)}
.bought{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:10px}
.dsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dsum .wb .v{font-size:1.05rem}
.dgroup{display:flex;flex-direction:column}
.dgroup h3{font-size:.88rem;font-weight:600;margin:6px 0 2px}
.payrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.payrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:16px;direction:ltr;text-align:right;min-width:0;width:8.5rem}
.payrow button.go{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.late{color:var(--out);font-weight:600}

/* log */
.day{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.day:first-child{border-top:0;padding-top:0}
.dayhead{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}
.dayhead strong{color:var(--ink);font-weight:600}
.item{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 4px;border-radius:10px}
.item .ops{grid-column:2/-1;display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%}
.dot.expense{background:var(--out)} .dot.income{background:var(--in)} .dot.save,.dot.withdraw{background:var(--save)}
.item .what{min-width:0}
.item .what .c{font-weight:500}
.item .what .n{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.item .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;font-weight:600}
.val.expense{color:var(--out)} .val.income{color:var(--in)} .val.save,.val.withdraw{color:var(--save)}
.item .ops button{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.82rem;padding:5px 12px;border-radius:8px}
.item .ops button:hover{background:var(--soft);color:var(--ink)}
.item .ops button.sure{background:var(--out);border-color:var(--out);color:var(--paper)}
.item .ops button.ed,.witem .ops button.ed{color:var(--accent);border-color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.give-big{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.give-big .num{font-size:1.5rem;font-weight:600;color:var(--give)}
@media (prefers-reduced-motion:no-preference){.fill,.gfill{transition:width .4s ease}}
@media (max-width:640px){
  .field input,.field select{font-size:16px;padding:12px}
  .amt input{font-size:1.6rem}
  .seg span{padding:10px 15px;font-size:.95rem}
  .chips button{padding:9px 13px;font-size:.92rem}
  .slip .btn{padding:14px 24px;font-size:1rem;flex:1 1 auto}
  h1{font-size:1.4rem}
  .today .wb .v{font-size:1.05rem}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1 data-en="My Money Book">دفتر فلوسي</h1>
      <div class="status" id="status">بيحمّل الدفتر…</div>
    </div>
    <div class="hbtns">
      <button type="button" class="chipbtn" id="langBtn">English</button>
      <button type="button" class="chipbtn" id="palBtn" aria-expanded="false" aria-controls="pals" data-en="Colors">الألوان</button>
      <button type="button" class="chipbtn" id="bkBtn" aria-expanded="false" aria-controls="backup" hidden data-en="Backup">نسخة احتياطية</button>
      <button type="button" class="chipbtn" id="logoutBtn" hidden data-en="Log out">خروج</button>
    </div>
    <div class="pals" id="pals" role="group" hidden><span id="palName"></span></div>
    <div class="pals" id="backup" hidden>
      <span id="bkNote" style="flex:1 1 100%"></span>
      <button type="button" class="chipbtn" id="bkDown" data-en="Download backup file">نزّلي ملف النسخة</button>

const CATS={
  expense:['أكل وشرب','مواصلات','بيت وفواتير','شغل وأدوات','كورسات وتعليم','لبس وعناية','صحة','خروجات','اشتراكات وموبايل','هدايا ومناسبات','تمرين ورياضة','صدقة','تاني'],
  income:['شغل إضافي','جمعية','هدية','تاني'],
  save:['حوشة عامة','طوارئ','الهدف','جمعية'],
  withdraw:['حوشة عامة','طوارئ','الهدف']
};
const CAT_EN={'أكل وشرب':'Food & drinks','مواصلات':'Transport','بيت وفواتير':'Home & bills','شغل وأدوات':'Work & tools','كورسات وتعليم':'Courses','لبس وعناية':'Clothes & care','صحة':'Health','خروجات':'Outings','اشتراكات وموبايل':'Subscriptions & phone','هدايا ومناسبات':'Gifts & occasions','تمرين ورياضة':'Exercise','صدقة':'Sadaqa','تاني':'Other','مرتب ثابت':'Salary','مرتب':'Salary','كوميشن الزومات':'Zoom commission','شغل إضافي':'Extra work','هدية':'Gift','حوشة عامة':'General savings','طوارئ':'Emergency fund','الهدف':'Goal','جمعية':'Gamʿeya'};
const catName=c=>lang==='en'?(CAT_EN[c]||c):c;

function unitsTxt(e){

}
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
/* ---------- budget months ----------
   Income paid early for next month (e.g. salary on the 29th for next month) starts that month's budget
   on the day it is received: spending and saving from that day on come out of the new month's money,
   unless the entry says otherwise (fromMonth). Whatever is left of a month carries over to the next. */
let PSC=null;
function payStarts(){const m={};entries.forEach(e=>{if(e.type!=='income'||!e.budgetMonth||!e.date)return;if(e.date.slice(0,7)!==addM(e.budgetMonth,-1))return;if(!m[e.budgetMonth]||e.date<m[e.budgetMonth])m[e.budgetMonth]=e.date});return m}
function autoBudget(date,PS){const ym=date.slice(0,7),nx=addM(ym,1);return PS[nx]&&date>=PS[nx]?nx:ym}
function budgetOf(e,PS){const d=e.date||'';if(e.type==='income')return e.budgetMonth||d.slice(0,7);if(e.type==='expense'||e.type==='save')return e.fromMonth||autoBudget(d,PS||PSC||payStarts());return d.slice(0,7)}
function ledger(ym,PS){
  // Carry-over starts at the first month that has income logged; months before tracking began stand alone.
  PS=PS||payStarts(); let minYm=ym; const bm=new Map();
  entries.forEach(e=>{if(!e.date)return;const b=budgetOf(e,PS);bm.set(e,b);if(e.type==='income'&&b<minYm)minYm=b});
  let carry=0,res={carry:0,inc:0,out:0,sv:0,df:0,left:0};
  for(let m=minYm;m<=ym;m=addM(m,1)){
    let inc=0,out=0,sv=0;
    bm.forEach((b,e)=>{if(b!==m)return;const a=+e.amount||0;if(e.type==='income')inc+=a;else if(e.type==='expense')out+=a;else if(e.type==='save')sv+=a;else if(e.type==='withdraw')sv-=a});
    const df=debtFlow(m), left=carry+inc-out-sv+df;
    if(m===ym) res={carry,inc,out,sv,df,left};
    carry=left;
  }
  return res;
}

async function hashPin(salt,pin){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const c of salt+':'+pin)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}
function loadLocal(){entries=[];wishes=[];debts=[];settings=Object.assign({},DEFAULTS);if(!profile)return;try{const r=JSON.parse(localStorage.getItem(dataKey())||'{}');entries=r.entries||[];wishes=r.wishes||[];debts=r.debts||[];settings=migrateSettings(Object.assign({},DEFAULTS,r.settings||{}))}catch(e){}}
function saveLocal(){if(!profile)return;try{localStorage.setItem(dataKey(),JSON.stringify({entries,settings,wishes,debts}))}catch(e){msg(L('المتصفح رفض يحفظ. اعملي نسخة احتياطية دلوقتي.','This browser refused to save. Copy a backup now.'),true)}}

async function init(){
  render();
  try{
    if(!window.claude||!window.claude.use) throw 0;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid) throw 0;
    // Visitors who can only view (e.g. outside the organization) cannot save to the account store: keep their book in their own browser instead.
    let canW=null; try{canW=await user.can('data.write')}catch(e){}
    if(canW===false) throw 0;
    const base=db.doc('data/users/'+uid+'/ledger');
    col=base.collection('entries'); wcol=base.collection('wishes'); dcol=base.collection('debts');
    setRef=db.doc('data/users/'+uid+'/settings');
    mode='cloud';
    col.orderBy('date','desc').limit(1000).onSnapshot(snap=>{entries=snap.docs.map(d=>Object.assign({id:d.id},d.data()));render()},
      ()=>msg(L('مش قادرة أقرا الدفتر دلوقتي. اعملي ريفرش للصفحة.','Could not read your book. Refresh the page.'),true));
    wcol.onSnapshot(s=>{wishes=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
    dcol.onSnapshot(s=>{debts=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
    setRef.onSnapshot(s=>{if(s.exists){settings=migrateSettings(Object.assign({},DEFAULTS,s.data()));
      if(settings.palette&&settings.palette!==curPal)applyPal(settings.palette);
      if(settings.lang&&settings.lang!==lang){lang=settings.lang;try{localStorage.setItem('ledger-lang',lang)}catch(e){}applyStatic();drawCats()}}
      render()},()=>{});
  }catch(e){mode='local';showAuth();return}
  render();
}

const paidOf=d=>(d.payments||[]).reduce((a,p)=>a+Number(p.amount),0);
const remOf=d=>Math.max(0,Number(d.amount)-paidOf(d));
function debtFlow(ym){let f=0;debts.forEach(d=>{const s=d.dir==='lent'?-1:1;if((d.date||'').slice(0,7)===ym)f+=s*Number(d.dir==='bank'?(d.received||0):d.amount);(d.payments||[]).forEach(p=>{if((p.date||'').slice(0,7)===ym)f-=s*Number(p.amount)})});return f}

  const cur=pref!==undefined?pref:($('fromMonth').value||'');

function buildForMonth(pref){

  $('forMonth').innerHTML=opts.map(v=>'<option value="'+v+'"'+(v===cur?' selected':'')+'>'+ymLabel(v)+(v===next?L(' (الشهر اللي بعده)',' (next month)'):v===same?L(' (نفس الشهر)',' (same month)'):'')+'</option>').join('');

function buildWorkMonth(pref){

  }catch(err){msg(err&&err.code==='quota_exceeded'?L('الدفتر اتملى. امسحي حركات قديمة الأول.','The book is full. Delete old entries first.'):L('ماتسجلش. جرّبي تاني كمان شوية.','Not saved. Try again shortly.'),true)}
  finally{$('submitBtn').disabled=false}
});

  const dflow=debtFlow(ym);

  if(isCurrent){
    t.push(['out',L('صرفت النهارده','Spent today'),todaySpent,avg?(todaySpent>avg*1.3?L('أعلى من متوسطك','Above your average'):todaySpent<avg*.7?L('أقل من متوسطك','Below your average'):L('قريب من متوسطك','Near your average')):'']);
    t.push(['out',L('صرفت الأسبوع ده','Spent this week'),weekSpent,L('من السبت ','Since Sat ')+ws.getDate()+' '+MO(ws.getMonth())]);

function curStats(){
  const t=new Date(), ym=ymOf(t), dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(), el=t.getDate();
  const mo=entries.filter(e=>(e.date||'').slice(0,7)===ym);
  const PS=payStarts(), lg=ledger(ym,PS);
  const inc=lg.inc, sp=lg.out, sv=lg.sv, carry=lg.carry;
  const days=new Set(mo.filter(e=>e.type==='expense').map(e=>e.date)).size;
  const avg=el?sum(mo,'expense')/el:0, rest=el>=3?avg*(dim-el):0;
  const bal=entries.reduce((a,e)=>a+(isGam(e)?0:e.type==='save'?+e.amount:e.type==='withdraw'?-e.amount:0),0);
  const gi=gamInfo(ym), gm=entries.filter(e=>isGam(e)&&budgetOf(e,PS)===ym); let gamAdj=0;
  if(gi.active&&!gm.some(e=>e.type==='save')) gamAdj-=gi.g.monthly;
  if(gi.payoutHere&&!mo.some(e=>e.cat===GAM&&(e.type==='withdraw'||e.type==='income'))) gamAdj+=gi.payout;
  const df=lg.df;
  let bankAdj=0;
  debts.forEach(d=>{if(d.dir!=='bank'||remOf(d)<=0)return;const idx=mDiff(d.start||ym,ym);if(idx<0||idx>=(+d.months||0))return;
    if(!(d.payments||[]).some(p=>(p.date||'').slice(0,7)===ym)) bankAdj-=Math.min(+d.inst||0,remOf(d))});
  return {ym,inc,sp,sv,carry,rest,gamAdj,df,bankAdj,proj:lg.left-rest+gamAdj+bankAdj,bal,el,days,mName:MO(t.getMonth())};
}

function drawDaily(byDay,dim,elapsed,avg,todayD,ym,month){
  const box=$('dailyChart'), rtl=lang!=='en';
  const W=Math.max(560,dim*22),H=190,pt=14,pb=26,pl=8,pr=46,ch=H-pt-pb;
  const max=Math.max(1,...byDay.slice(1));
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=max/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p})();
  const y=v=>pt+ch-(v/nice)*ch;
  const slot=(W-pl-pr)/dim, bw=Math.max(6,slot*.62);
  let g='';
  [0,.5,1].forEach(f=>{const v=nice*f,yy=y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(W-pr+6)+'" y="'+(yy+4)+'" fill="var(--muted)" font-size="10" font-family="IBM Plex Mono,monospace" text-anchor="start">'+money(v)+'</text>'});
  for(let d=1;d<=dim;d++){
    const cx=rtl?W-pr-(d-.5)*slot:pl+(d-.5)*slot, v=byDay[d], h=Math.max(v>0?2:0,ch*v/nice);
    const future=d>elapsed;
    const fill=d===pickedDay?'var(--accent)':future?'var(--soft)':'var(--out)';
    const op=(d===todayD||d===pickedDay||future)?1:.6;
    g+='<g data-d="'+d+'" style="cursor:pointer"><rect x="'+(cx-slot/2)+'" y="'+pt+'" width="'+slot+'" height="'+ch+'" fill="transparent"/>'+
       '<rect x="'+(cx-bw/2)+'" y="'+(pt+ch-h)+'" width="'+bw+'" height="'+h+'" rx="2" fill="'+fill+'" opacity="'+op+'"/>'+
       '<title>'+d+' '+MO(viewM)+': '+money(v)+' '+CUR()+'</title></g>';
    if(d===1||d%5===0||d===dim) g+='<text x="'+cx+'" y="'+(H-8)+'" fill="'+(d===todayD?'var(--ink)':'var(--muted)')+'" font-size="10" font-family="IBM Plex Mono,monospace" text-anchor="middle">'+d+'</text>';
  }
  if(avg>0){const yy=y(avg);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(pl+2)+'" y="'+(yy-5)+'" fill="var(--accent)" font-size="10.5" font-family="IBM Plex Sans Arabic,sans-serif" text-anchor="start">'+L('متوسط ','avg ')+money(avg)+'</text>'}
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+L('الصرف اليومي في الشهر','Daily spending this month')+'">'+g+'</svg>';
  box.querySelectorAll('g[data-d]').forEach(el=>el.addEventListener('click',()=>{pickedDay=+el.dataset.d;render()}));
  const p=$('dayPick');
  if(pickedDay){
    const di=ym+'-'+pad(pickedDay);
    const by={};month.filter(e=>e.date===di&&e.type==='expense').forEach(e=>by[e.cat]=(by[e.cat]||0)+Number(e.amount));
    const parts=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>esc(catName(c))+' '+M(v));
    p.innerHTML='<strong>'+WD(parse(di).getDay())+' '+pickedDay+' '+MO(viewM)+':</strong> '+M(byDay[pickedDay])+' '+CUR()+(parts.length?' — '+parts.join(L('، ',', ')):L(' — ماصرفتيش حاجة.',' — nothing spent.'));
  } else p.textContent=entries.length?L('دوسي على أي عمود تشوفي صرفتي في إيه اليوم ده.','Tap any bar to see what you spent that day.'):'';
}

function drawConsistency(byDay,elapsed,avg){
  const v=$('verdict'), s=$('dayStats');
  const days=byDay.slice(1,elapsed+1);
  const active=days.filter(x=>x>0).length;
  if(elapsed<3||active<2){v.innerHTML='<span class="pill mid">'+L('محتاجة كام يوم تسجيل','Needs a few days of entries')+'</span>';s.innerHTML='<span class="muted">'+L('بعد 3 أيام تسجيل هقولك أيامك شبه بعض ولا لأ.','After 3 days of entries you will see whether your days are similar.')+'</span>';return}
  const sd=Math.sqrt(days.reduce((a,x)=>a+(x-avg)*(x-avg),0)/days.length);
  const cv=avg?sd/avg:0;
  const [cls,txt]=cv<.4?['ok',L('أيامك متقاربة','Your days are similar')]:cv<.85?['mid',L('فيه تفاوت متوسط','Some variation')]:['hi',L('أيامك مختلفة جدًا','Your days vary a lot')];
  v.innerHTML='<span class="pill '+cls+'">'+txt+'</span>';
  let mx=0,mxD=1,mn=Infinity;days.forEach((x,i)=>{if(x>mx){mx=x;mxD=i+1}if(x<mn){mn=x}});
  s.innerHTML='<span>'+L('متوسط اليوم','Daily avg')+' <b>'+money(avg)+'</b></span><span>'+L('أعلى يوم','Highest')+' <b>'+money(mx)+'</b> ('+mxD+' '+MO(viewM)+')</span><span>'+L('أقل يوم','Lowest')+' <b>'+money(mn)+'</b></span><span>'+L('أيام من غير صرف','No-spend days')+' <b>'+(days.length-active)+'</b></span><span>'+L('الفرق المعتاد عن المتوسط','Typical swing')+' ± <b>'+money(sd)+'</b></span>';
}

function drawWeeks(byDay,dim,elapsed){
  const weeks=[];let cur=null;
  for(let d=1;d<=dim;d++){const dt=new Date(viewY,viewM,d);if(!cur||dt.getDay()===6){cur={from:d,to:d,sum:0};weeks.push(cur)}cur.to=d;cur.sum+=byDay[d]}
  const mx=Math.max(1,...weeks.map(w=>w.sum));
  $('weekBars').innerHTML=weeks.map((w,i)=>{const fut=w.from>elapsed;
    return '<div class="bar"><span>'+L('الأسبوع ','Week ')+(i+1)+' <span class="muted num" style="font-size:.78rem">'+w.from+'–'+w.to+'</span></span><div class="track"><div class="fill wk" style="width:'+(w.sum/mx*100)+'%"></div></div><span class="amt2'+(fut?' muted':'')+'">'+(fut&&!w.sum?'—':money(w.sum))+'</span></div>'}).join('');
  const tot=new Array(7).fill(0),cnt=new Array(7).fill(0);
  for(let d=1;d<=Math.min(elapsed,dim);d++){const w=new Date(viewY,viewM,d).getDay();tot[w]+=byDay[d];cnt[w]++}
  const avgs=tot.map((x,i)=>cnt[i]?x/cnt[i]:0);const top=Math.max(...avgs);
  $('wkdays').innerHTML=WD_ORDER.map(i=>'<div class="wkd'+(top>0&&avgs[i]===top?' top':'')+'"><span>'+WD(i)+'</span><b>'+(cnt[i]?money(avgs[i]):'—')+'</b></div>').join('');
}

function drawFlow(income,spent,netSaved,incomeList){
  const mx=Math.max(1,income,spent,Math.abs(netSaved));
  const row=(l,v,c)=>'<div class="bar"><span>'+l+'</span><div class="track"><div class="fill" style="background:var('+c+');width:'+(Math.abs(v)/mx*100)+'%"></div></div><span class="amt2">'+money(v)+'</span></div>';
  $('flowBars').innerHTML=row(L('دخل','Income'),income,'--in')+row(L('مصروف','Spending'),spent,'--out')+row(L('حوشة','Savings'),netSaved,'--save');
  const by={};incomeList.forEach(e=>by[e.cat]=(by[e.cat]||0)+Number(e.amount));
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $('incomeBars').innerHTML=rows.length?'<h3 style="font-size:.9rem;font-weight:600">'+L('الدخل جه منين','Where income came from')+'</h3>'+rows.map(([c,v])=>'<div class="bar"><span>'+esc(catName(c))+'</span><div class="track"><div class="fill" style="background:var(--in);width:'+(v/rows[0][1]*100)+'%"></div></div><span class="amt2">'+money(v)+'</span></div>').join(''):'<div class="empty">'+L('سجّلي دخلك عشان تشوفي الفرق بين اللي داخل واللي خارج.','Log your income to compare money in and out.')+'</div>';
}

function drawFixed(incomeList,isCurrent,isFuture,today){
  const mName=MO(viewM), btn=(f,txt)=>'<button type="button" data-fill="'+esc(f)+'">'+txt+'</button>';
  let h='';
  const ymS=viewY+'-'+pad(viewM+1);
  srcList().forEach(sr=>{
    const got=incomeList.filter(e=>e.cat===sr.name);
    const recv=sr.spendNext?addM(ymS,-1):ymS, rm=MO(+recv.slice(5)-1);
    const d1=Math.min(sr.day||1,daysIn(recv)), d2=Math.min(sr.dayTo||sr.day||1,daysIn(recv));
    const lastDue=parse(recv+'-'+pad(Math.max(d1,d2)));
    const when=(sr.dayTo&&sr.dayTo!==sr.day?L('من '+d1+' لـ '+d2+' '+rm,d1+'–'+d2+' '+rm):d1+' '+rm);
    const work=sr.forPrev?' <span class="sub">· '+L('عن شغل ','for work in ')+MO(+addM(recv,-1).slice(5)-1)+'</span>':'';
    if(got.length){
      const net=got.reduce((a,e)=>a+Number(e.amount),0), ded=got.reduce((a,e)=>a+(Number(e.deductions)||0),0), gross=got.reduce((a,e)=>a+(Number(e.gross)||Number(e.amount)),0);
      const cnt=got.reduce((a,e)=>a+(Number(e.zooms)||0),0);
      const rec=got.map(e=>dFmt(e.date)+(parse(e.date)>lastDue?L(' (متأخر)',' (late)'):'')).join(L('، ',', '));
      let sub='<div class="sub">'+L('اتقبض ','Received ')+rec+'</div>';
      if(sr.deductions) sub+='<div class="sub">'+M(gross)+L(' − خصومات ',' − deductions ')+M(ded)+(gross?' ('+Math.round(ded/gross*100)+'%)':'')+'</div>';
      if(sr.kind==='units') sub+='<div class="sub">'+(cnt?got.map(unitsTxt).filter(Boolean).join(L('، ',', '))+L(' · حوالي ',' · about ')+M(gross/cnt)+L(' للواحد',' each'):L('سجّلي العدد عشان تعرفي الواحد بيجيب كام','Log the counts to see what each one earns'))+'</div>';
      h+='<div class="fx"><div><div class="t">'+esc(catName(sr.name))+' · '+mName+work+'</div>'+sub+'</div><span style="font-weight:600;color:var(--in)"><span class="num">'+money(net)+'</span>'+(sr.deductions?' '+L('صافي','net'):'')+'</span></div>';
    } else {
      const due=lastDue<=today, firstDue=parse(recv+'-'+pad(d1));
      const amt=sr.kind==='fixed'&&sr.amount?M(sr.amount)+(sr.deductions?L(' قبل الخصومات',' before deductions'):'')+' · ':'';
      const spend=sr.spendNext?L(' · ويتصرف في '+mName,' · spent in '+mName):'';
      if(due) h+='<div class="fx todo"><div><div class="t">'+esc(catName(sr.name))+' · '+mName+work+'</div><div class="sub">'+amt+L('لسه متسجلش. بيتقبض ','Not logged yet. Paid ')+when+spend+'</div></div>'+btn('SRC:'+sr.id,L('سجّليه','Log it'))+'</div>';
      else h+='<div class="fx"><div><div class="t">'+esc(catName(sr.name))+' · '+mName+work+'</div><div class="sub">'+amt+L('متوقع يتقبض ','Expected ')+when+spend+'</div></div>'+(firstDue<=today?btn('SRC:'+sr.id,L('سجّليه','Log it')):'')+'</div>';
    }
  });
  const ymV=viewY+'-'+pad(viewM+1), gi=gamInfo(ymV), real=entries.filter(e=>(e.date||'').slice(0,7)===ymV&&e.cat===GAM);
  const no=L('رقم '+gi.idx+' من '+gi.g.months,'No. '+gi.idx+' of '+gi.g.months);
  if(gi.active){
    const paid=real.filter(e=>e.type==='save').reduce((a,e)=>a+Number(e.amount),0);
    h+=paid?'<div class="fx"><div><div class="t">'+L('قسط الجمعية اتدفع','Gamʿeya installment paid')+'</div><div class="sub">'+no+'</div></div><span class="num" style="font-weight:600;color:var(--save)">'+money(paid)+'</span></div>'
      :(isFuture?'<div class="fx"><div><div class="t">'+L('قسط الجمعية','Gamʿeya installment')+' · '+M(gi.g.monthly)+'</div><div class="sub">'+no+'</div></div></div>'
      :'<div class="fx todo"><div><div class="t">'+L('قسط الجمعية لسه متسجلش','Gamʿeya installment not logged')+'</div><div class="sub">'+M(gi.g.monthly)+' · '+no+'</div></div>'+btn('GAM',L('سجّليه','Log it'))+'</div>');
  }
  if(gi.payoutHere){
    const got=real.filter(e=>e.type==='withdraw'||e.type==='income').reduce((a,e)=>a+Number(e.amount),0);
    h+=got?'<div class="fx"><div><div class="t">'+L('قبضتي الجمعية','You received the gamʿeya')+'</div><div class="sub">'+L('فاضل '+(gi.g.months-gi.idx)+' قسط لحد ',(gi.g.months-gi.idx)+' installments left until ')+ymLabel(gi.end)+'</div></div><span class="num" style="font-weight:600;color:var(--in)">'+money(got)+'</span></div>'
      :'<div class="fx todo"><div><div class="t">'+L('هتقبضي الجمعية في '+mName,'Gamʿeya payout in '+mName)+'</div><div class="sub">'+M(gi.payout)+L(' · سجّليها أول ما تقبضي',' · log it when you receive it')+'</div></div>'+(isFuture?'':btn('GAMOUT',L('قبضتها','Received')))+'</div>';
  }
  debts.filter(d=>d.dir==='bank').forEach(d=>{
    const idx=mDiff(d.start||ymV,ymV); if(idx<0||idx>=(+d.months||0)) return;
    const paidM=(d.payments||[]).filter(p=>(p.date||'').slice(0,7)===ymV).reduce((a,p)=>a+Number(p.amount),0);
    const no=L('قسط '+(idx+1)+' من '+d.months,'Installment '+(idx+1)+' of '+d.months);
    h+=paidM?'<div class="fx"><div><div class="t">'+esc(d.person)+L(' · القسط اتدفع',' · installment paid')+'</div><div class="sub">'+no+'</div></div><span class="num" style="font-weight:600;color:var(--out)">'+money(paidM)+'</span></div>'
      :(isFuture||remOf(d)<=0?'<div class="fx"><div><div class="t">'+esc(d.person)+' · '+M(d.inst)+'</div><div class="sub">'+no+'</div></div></div>'
      :'<div class="fx todo"><div><div class="t">'+esc(d.person)+L(' · القسط لسه متدفعش',' · installment not paid yet')+'</div><div class="sub">'+M(d.inst)+' · '+no+'</div></div>'+btn('BANK:'+d.id,L('دفعته','Paid it'))+'</div>');
  });
  $('fixedBox').innerHTML=h;
  drawSources();
}

function drawSavings(savedM,withM,incomeM){
  const all=entries.reduce((a,e)=>a+(isGam(e)?0:e.type==='save'?+e.amount:e.type==='withdraw'?-e.amount:0),0);
  const gm=entries.filter(e=>isGam(e)&&budgetOf(e)===viewY+'-'+pad(viewM+1)).reduce((a,e)=>a+(e.type==='save'?+e.amount:-e.amount),0);
  const net=savedM-withM-gm;
  $('saveRate').textContent=incomeM?L('حوّشتي '+Math.round(net/incomeM*100)+'% من دخل الشهر','Saved '+Math.round(net/incomeM*100)+'% of this month’s income'):'';
  let h='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="muted" style="font-size:.85rem">'+L('رصيد الحوشة كله','Total savings')+'</span><span class="num" style="font-size:1.5rem;font-weight:600;color:var(--save)">'+money(all)+' <span class="cur">'+CUR()+'</span></span></div>';
  if(settings.goalAmount>0){const pc=Math.max(0,Math.min(100,all/settings.goalAmount*100));
    h+='<div class="gtrack" role="progressbar" aria-valuenow="'+Math.round(pc)+'" aria-valuemin="0" aria-valuemax="100"><div class="gfill" style="width:'+pc+'%"></div></div>'+
       '<div style="font-size:.85rem">'+(settings.goalName?esc(settings.goalName)+': ':L('الهدف: ','Goal: '))+M(all)+L(' من ',' of ')+M(settings.goalAmount)+' '+CUR()+L(' — فاضل ',' — ')+M(Math.max(0,settings.goalAmount-all))+L('',' to go')+'</div>';}
  else h+='<div class="muted" style="font-size:.85rem">'+L('حطي هدف تحوّشي له وهتشوفي وصلتي لفين.','Set a goal to track your progress.')+'</div>';
  const tg=new Date(), gi=gamInfo(ymOf(tg));
  if(!gi.none&&gi.idx<=gi.g.months){
    const after=mDiff(gi.g.payoutMonth,ymOf(tg))>0, leftN=gi.g.months-gi.idx;
    h+='<div class="fx" style="margin-top:4px"><div><div class="t">'+L('الجمعية','Gamʿeya')+' · '+M(gi.g.monthly)+' × '+gi.g.months+L(' شهور',' months')+'</div><div class="sub">'+(gi.idx>=1?L('القسط رقم '+gi.idx+' من '+gi.g.months,'Installment '+gi.idx+' of '+gi.g.months)+' · ':'')+L('بتخلص ','ends ')+ymLabel(gi.end)+'</div><div class="sub">'+(after?L('قبضتيها '+ymLabel(gi.g.payoutMonth)+'، فاضل '+leftN+' قسط (','Received '+ymLabel(gi.g.payoutMonth)+', '+leftN+' installments left (')+M(leftN*gi.g.monthly)+')':L('هتقبضي ','You get ')+M(gi.payout)+L(' في ',' in ')+ymLabel(gi.g.payoutMonth))+'</div></div></div>';
  }
  $('goal').innerHTML=h;
  const ae=document.activeElement&&document.activeElement.id;
  if(ae!=='goalName'&&ae!=='goalAmount'){$('goalName').value=settings.goalName||'';$('goalAmount').value=settings.goalAmount||''}
}

function drawGive(month,income){
  const ym=viewY+'-'+pad(viewM+1), y=String(viewY);
  const gm=month.filter(e=>e.type==='expense'&&e.cat===GIVE);
  const tot=gm.reduce((a,e)=>a+Number(e.amount),0);
  const yr=entries.filter(e=>e.type==='expense'&&e.cat===GIVE&&(e.date||'').slice(0,4)===y);
  const yTot=yr.reduce((a,e)=>a+Number(e.amount),0);
  $('giveRate').textContent=income&&tot?L(Math.round(tot/income*1000)/10+'% من دخل الشهر',Math.round(tot/income*1000)/10+'% of income'):'';
  let h='<div class="give-big"><span class="muted" style="font-size:.85rem">'+L('صدقة '+MO(viewM),'Sadaqa in '+MO(viewM))+'</span><span class="num">'+money(tot)+' <span class="cur">'+CUR()+'</span></span></div>';
  const goal=settings.giveGoal>0?(settings.giveMode==='pct'?income*settings.giveGoal/100:settings.giveGoal):0;
  if(goal>0){const pc=Math.max(0,Math.min(100,tot/goal*100));
    h+='<div class="gtrack" role="progressbar" aria-valuenow="'+Math.round(pc)+'" aria-valuemin="0" aria-valuemax="100"><div class="gfill give" style="width:'+pc+'%"></div></div>'+
      '<div style="font-size:.85rem">'+L('الهدف ','Goal ')+M(goal)+(settings.giveMode==='pct'?' ('+settings.giveGoal+'%)':'')+(tot>=goal?L(' — وصلتيله، ربنا يتقبل',' — reached'):L(' — فاضل ',' — ')+M(goal-tot)+L('',' to go'))+'</div>';
  } else if(settings.giveGoal>0&&settings.giveMode==='pct'){h+='<div class="muted" style="font-size:.85rem">'+L('الهدف '+settings.giveGoal+'% من الدخل، هيتحسب أول ما يتسجل دخل الشهر.','Goal is '+settings.giveGoal+'% of income; it is calculated once this month’s income is logged.')+'</div>'}
  else h+='<div class="muted" style="font-size:.85rem">'+L('لو حابة، حطي هدف شهري بمبلغ أو نسبة من الدخل.','Optionally set a monthly goal as an amount or a share of income.')+'</div>';
  h+='<div class="sub muted" style="font-size:.82rem">'+L('في '+viewY+': ','In '+viewY+': ')+M(yTot)+' '+CUR()+L(' على '+yr.length+' مرة',' across '+yr.length+' times')+'</div>';
  $('giveBox').innerHTML=h;
  const ae=document.activeElement&&document.activeElement.id;
  if(ae!=='giveGoal'&&ae!=='giveMode'){$('giveGoal').value=settings.giveGoal||'';$('giveMode').value=settings.giveMode||'pct'}
}

function drawLog(month,early){
  early=early||[];
  $('logCount').textContent=(month.length+early.length)?(month.length+early.length)+L(' حركة',' entries'):'';
  if(!month.length&&!early.length){
    $('log').innerHTML=mode==='loading'?'<div class="empty">'+L('بيحمّل…','Loading…')+'</div>':'<div class="empty">'+L('مفيش حركات في '+MO(viewM)+' لسه.','No entries in '+MO(viewM)+' yet.')+'</div>';return}
  const days={};month.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  const earlyH=early.length?'<div class="day"><div class="dayhead"><strong>'+L('من فلوس '+MO(viewM)+' · بعد يوم القبض','From '+MO(viewM)+' money · after payday')+'</strong><span>'+L('صرفت ','Spent ')+M(early.reduce((a,e)=>a+(e.type==='expense'?+e.amount:0),0))+' '+CUR()+'</span></div>'+early.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0)).map(e=>itemHTML(e).replace('<div class="what">','<div class="what"><div class="n">'+WD(parse(e.date).getDay())+' '+dFmt(e.date)+'</div>')).join('')+'</div>':'';
  $('log').innerHTML=earlyH+Object.keys(days).sort().reverse().map(k=>{
    const list=days[k].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const out=list.reduce((a,e)=>a+(e.type==='expense'?+e.amount:0),0), d=parse(k);
    return '<div class="day"><div class="dayhead"><strong>'+WD(d.getDay())+' '+d.getDate()+' '+MO(d.getMonth())+'</strong><span>'+L('صرفت ','Spent ')+M(out)+' '+CUR()+'</span></div>'+list.map(itemHTML).join('')+'</div>'}).join('');
}
async function onListClick(e){
  const ed=e.target.closest('[data-edit]'),dl=e.target.closest('[data-del]');
  if(ed){const x=entries.find(v=>v.id===ed.dataset.edit);if(!x)return;
    resetForm();editId=x.id;selType=x.type;selCat=x.cat;$('t-'+x.type).checked=true;
    $('amount').value=x.gross||x.amount;$('deduct').value=x.deductions||'';$('date').value=x.date;
    $('forMonth').innerHTML='';$('workMonth').innerHTML='';
    drawCats();
    if(x.type==='income'&&srcByName(x.cat)){buildForMonth(x.budgetMonth||x.date.slice(0,7));if(x.workMonth)buildWorkMonth(x.workMonth);drawUnitInputs(Object.assign({},x.units||x.zoomsBy||{}))}
    if(x.type==='expense'||x.type==='save') buildFromMonth(x.fromMonth||'');
    $('note').value=x.note||'';$('method').value=x.method||'كاش';
    $('cancelEdit').hidden=false;$('submitBtn').textContent=L('احفظ التعديل','Save changes');switchTab('add');$('amount').focus();return}
  if(dl){const id=dl.dataset.del;
    if(armedDel!==id){armedDel=id;render();setTimeout(()=>{if(armedDel===id){armedDel=null;render()}},3500);return}
    armedDel=null;try{await delEntry(id);msg(L('اتمسح.','Deleted.'))}catch(err){msg(L('ماتمسحش. جرّبي تاني.','Not deleted. Try again.'),true)}}
}
$('log').addEventListener('click',onListClick);
$('todayList').addEventListener('click',onListClick);

/* ---------- income sources editor ---------- */
let srcEdit=null, srcDelArmed=false;
const KIND_SRC=k=>({fixed:L('ثابت','Fixed'),variable:L('متغير','Varies'),units:L('بالعدد','By count')})[k]||'';
function drawSources(){
  const list=srcList();
  $('srcList').innerHTML=list.length?list.map(sr=>{
    const when=sr.dayTo&&sr.dayTo!==sr.day?L('من '+sr.day+' لـ '+sr.dayTo,'days '+sr.day+'–'+sr.dayTo):L('يوم '+(sr.day||1),'day '+(sr.day||1));
    const bits=[KIND_SRC(sr.kind),sr.kind==='fixed'&&sr.amount?money(sr.amount)+' '+CUR():'',sr.kind==='units'?(sr.units||[]).map(u=>esc(u.name)+' '+money(u.rate)+(u.until?L(' لحد ',' until ')+ymLabel(u.until):'')).join('، '):'',L('بيتقبض ','paid ')+when,sr.spendNext?L('بيتصرف الشهر اللي بعده','spent the month after'):'',sr.forPrev?L('عن شغل الشهر اللي قبله','for the previous month’s work'):'',sr.deductions?L('عليه خصومات','has deductions'):''].filter(Boolean).join(' · ');
    return '<div class="srcrow"><div><div class="t">'+esc(catName(sr.name))+'</div><div class="sub">'+bits+'</div></div><button type="button" data-src="'+esc(sr.id)+'">'+L('تعديل','Edit')+'</button></div>'}).join('')
    :'<div class="empty">'+L('ضيفي مصادر دخلك (المرتب، أي كوميشن، شغل حر…) عشان الدفتر يفكّرك بيها كل شهر ويعرف بتتصرف إمتى.','Add your income sources (salary, commission, freelance…) so the book reminds you each month and knows when each is spent.')+'</div>';
}
function unitRowHTML(u){u=u||{};return '<div class="unitrow" data-key="'+esc(u.key||'')+'"><label class="field"><span>'+L('الاسم','Name')+'</span><input class="un" maxlength="20" value="'+esc(u.name||'')+'" placeholder="'+L('مثلاً: IADB','e.g. Course A')+'"></label><label class="field"><span>'+L('السعر للواحد','Price each')+'</span><input class="ur" inputmode="decimal" value="'+esc(u.rate||'')+'" style="direction:ltr;text-align:right"></label><label class="field"><span>'+L('لحد شهر (اختياري)','Until month (optional)')+'</span><input class="uu" type="month" value="'+esc(u.until||'')+'"></label><button type="button" class="urm" aria-label="'+L('شيلي','Remove')+'">×</button></div>'}
function srcFormUI(){

function openSrcForm(sr){
  srcEdit=sr?sr.id:null; srcDelArmed=false; sr=sr||{kind:'fixed',day:1,spendNext:false,forPrev:false,deductions:false,units:[]};

$('srcForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('srcName').value.trim(), kind=$('srcKind').value, list=srcList().slice();
  if(!name){msg(L('اكتبي اسم المصدر.','Enter a name for the source.'),true);$('srcName').focus();return}
  if(list.some(x=>x.name===name&&x.id!==srcEdit)){msg(L('فيه مصدر بنفس الاسم.','A source with this name already exists.'),true);return}
  const day=Math.min(Math.max(parseInt(num($('srcDay').value))||1,1),31), dayTo=parseInt(num($('srcDayTo').value))||0;
  const units=[];
  if(kind==='units'){
    $('srcUnits').querySelectorAll('.unitrow').forEach((r,i)=>{const nm=r.querySelector('.un').value.trim(), rate=num(r.querySelector('.ur').value);if(nm&&rate>0)units.push({key:r.dataset.key||('u'+Date.now().toString(36)+i),name:nm,rate,until:r.querySelector('.uu').value||''})});
    if(!units.length){msg(L('ضيفي سعر واحد على الأقل (اسم وسعر).','Add at least one price (name and price).'),true);return}
  }
  const sr={id:srcEdit||('s'+Date.now().toString(36)),name,kind,amount:kind==='fixed'?(num($('srcAmt').value)||0):0,day,dayTo:dayTo>=day&&dayTo<=31?dayTo:0,spendNext:$('srcSpend').value==='next',forPrev:$('srcWork').value==='prev',deductions:$('srcDed').checked,unitName:$('srcUnitName').value.trim(),units};
  const old=srcEdit?list.find(x=>x.id===srcEdit):null;

const wishCost=w=>Number(w.cost)||0;
function drawWishes(){
  const s=curStats();
  const open=wishes.filter(w=>!w.bought).sort((a,b)=>(a.prio-b.prio)||((a.createdAt||0)-(b.createdAt||0)));
  const done=wishes.filter(w=>w.bought).sort((a,b)=>(b.boughtAt||'').localeCompare(a.boughtAt||''));
  const total=open.reduce((a,w)=>a+wishCost(w),0);
  $('wishSum').innerHTML=open.length?open.length+L(' حاجة · ',' items · ')+M(total)+' '+CUR():'';
  const avail=Math.max(0,s.proj);
  const parts=[L('دخل ','Income ')+money(s.inc),L('صرفتي ','spent ')+money(s.sp)];
  let sub=(s.carry?L('مترحّل ','Carried ')+(s.carry<0?'−':'')+money(Math.abs(s.carry))+' + ':'')+parts.join(' − ')+(s.rest?L(' − متوقع ',' − expected ')+money(s.rest)+L(' لآخر الشهر',' to month end'):'')+(s.sv?L(' − حوشة وجمعية ',' − savings & gamʿeya ')+money(s.sv):'')+(s.gamAdj<0?L(' − قسط جمعية ',' − gamʿeya installment ')+money(-s.gamAdj):s.gamAdj>0?L(' + قبض جمعية ',' + gamʿeya payout ')+money(s.gamAdj):'')+(s.df?(s.df>0?L(' + سلف ',' + loans '):L(' − سلف ',' − loans '))+money(Math.abs(s.df)):'')+(s.bankAdj?L(' − أقساط بنك ',' − bank installments ')+money(-s.bankAdj):'');
  $('wishBudget').innerHTML=
    '<div class="wb"><span class="k">'+L('متوقع يفضل معاكي آخر ','Expected left at end of ')+s.mName+'</span><span class="v" style="color:var('+(s.proj>=0?'--in':'--out')+')">'+(s.proj<0?'−':'')+money(Math.abs(s.proj))+'</span><span class="s">'+sub+'</span></div>'+
    '<div class="wb"><span class="k">'+L('رصيد الحوشة','Savings balance')+'</span><span class="v" style="color:var(--save)">'+money(s.bal)+'</span><span class="s">'+L('لو اضطريتي تسحبي منها','If you need to dip into it')+'</span></div>'+
    '<div class="wb"><span class="k">'+L('مجموع اللي عايزاه','Wish list total')+'</span><span class="v">'+money(total)+'</span><span class="s">'+(s.el<3||s.days<3?L('التوقع هيبقى أدق بعد كام يوم تسجيل','Estimate improves after a few days of entries'):(total<=avail?L('كله يدخل في المتاح','All of it fits'):L('أكتر من المتاح بـ ','Over budget by ')+money(total-avail)))+'</span></div>';
  let cum=0;
  const rows=open.map(w=>{
    const c=wishCost(w); cum+=c; let cls,txt;
    if(cum<=avail){cls='ok';txt=L('تقدري تجيبيها في ','You can get it in ')+s.mName}
    else if(c<=avail){cls='mid';txt=L('تقدري، بس مش مع كل اللي فوقها — اختاري','You can, but not with everything above it — choose')}
    else if(c<=avail+s.bal){cls='mid';txt=L('مش من فلوس الشهر، ممكن من الحوشة (هتسحبي ','Not from this month — maybe from savings (take ')+money(c-avail)+')'}
    else{const gap=c-avail-s.bal;cls='hi';txt=L('أجّليها — ناقصك ','Postpone — short by ')+money(gap)+(s.proj>0&&s.el>=3?L('، حوالي '+Math.ceil(gap/s.proj)+' شهر لو فضل معاكي زي الشهر ده',', about '+Math.ceil(gap/s.proj)+' months at this month’s pace'):'')}
    const meta=[KIND(w.kind),w.kind==='monthly'?L('يعني ','that’s ')+money(c*12)+L(' في السنة',' a year'):'',w.kind==='yearly'?L('يعني ','that’s ')+money(c/12)+L(' في الشهر',' a month'):'',esc(catName(w.cat||'')),esc(w.note||'')].filter(Boolean).join(' · ');
    const bA=armedWish==='b'+w.id, dA=armedWish==='d'+w.id;
    return '<div class="witem"><div><div class="c">'+esc(w.name)+'<span class="prio p'+w.prio+'">'+PRIO()[w.prio]+'</span></div><div class="n">'+meta+'</div><div class="wv '+cls+'">'+txt+'</div></div><span class="val">'+money(c)+(w.kind==='monthly'?'<span class="cur">/'+L('شهر','mo')+'</span>':w.kind==='yearly'?'<span class="cur">/'+L('سنة','yr')+'</span>':'')+'</span>'+
      '<div class="ops"><button type="button" class="ed" data-wedit="'+esc(w.id)+'">'+L('تعديل','Edit')+'</button><button type="button" class="buy'+(bA?' sure':'')+'" data-wbuy="'+esc(w.id)+'">'+(bA?L('أكدي: هتتسجل مصروف ','Confirm: logs an expense of ')+money(c):(w.kind==='once'?L('اشتريتها','Bought it'):L('اشتركت','Subscribed')))+'</button><button type="button" class="'+(dA?'sure':'')+'" data-wdel="'+esc(w.id)+'">'+(dA?L('متأكدة؟','Sure?'):L('مسح','Delete'))+'</button></div></div>';
  }).join('');
  const doneH=done.length?'<div class="bought"><strong style="color:var(--ink);font-weight:600">'+L('اتجابت','Done')+'</strong>'+done.slice(0,6).map(w=>'<span>✓ '+esc(w.name)+' — '+M(wishCost(w))+(w.boughtAt?' · '+dFmt(w.boughtAt):'')+'</span>').join('')+'</div>':'';
  $('wishList').innerHTML=(rows||'<div class="empty">'+L('ضيفي أي حاجة نفسك تجيبيها أو تشتركي فيها وهقولك تقدري تجيبيها الشهر ده ولا تأجليها.','Add anything you want to buy or subscribe to, and see whether it fits this month or should wait.')+'</div>')+doneH;
}

function bankNext(d){
  const n=(d.payments||[]).length; if(!d.start||n>=(+d.months||0)) return '';
  const ym=addM(d.start,n), dim=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
  return ym+'-'+pad(Math.min(+d.day||1,dim));
}

function drawDebts(){
  const open=debts.filter(d=>remOf(d)>0).sort((a,b)=>((a.dir==='bank'?bankNext(a):a.due)||'9999').localeCompare((b.dir==='bank'?bankNext(b):b.due)||'9999')||(a.date||'').localeCompare(b.date||''));
  const closed=debts.filter(d=>remOf(d)<=0).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const Lo=open.filter(d=>d.dir==='lent'), Bo=open.filter(d=>d.dir==='borrowed'), Ko=open.filter(d=>d.dir==='bank');
  const ymNow=ymOf(new Date());
  const instNow=Ko.reduce((a,d)=>{const idx=mDiff(d.start,ymNow);return a+(idx>=0&&idx<d.months?+d.inst:0)},0);
  $('debtSum').innerHTML=
    '<div class="wb"><span class="k">'+L('ليا عند الناس','Owed to me')+'</span><span class="v" style="color:var(--in)">'+money(Lo.reduce((a,d)=>a+remOf(d),0))+'</span><span class="s">'+Lo.length+L(' مفتوحة',' open')+'</span></div>'+
    '<div class="wb"><span class="k">'+L('عليا للناس','I owe people')+'</span><span class="v" style="color:var(--out)">'+money(Bo.reduce((a,d)=>a+remOf(d),0))+'</span><span class="s">'+Bo.length+L(' مفتوح',' open')+'</span></div>'+
    '<div class="wb"><span class="k">'+L('قروض وتقسيط','Bank loans')+'</span><span class="v" style="color:var(--out)">'+money(Ko.reduce((a,d)=>a+remOf(d),0))+'</span><span class="s">'+(instNow?L('أقساط الشهر ','This month ')+money(instNow):Ko.length+L(' مفتوح',' open'))+'</span></div>';
  const today=iso(new Date());
  const item=d=>{
    const bank=d.dir==='bank', lent=d.dir==='lent', rem=remOf(d), paid=paidOf(d);
    let meta;
    if(bank){const nx=bankNext(d), late=nx&&nx<today;
      meta=[L('استلمتي ','Received ')+money(d.received||0)+(d.date?' · '+dFmt(d.date):''),L('قسط ','Installment ')+money(d.inst)+' × '+d.months,L('اتدفع ','Paid ')+(d.payments||[]).length+L(' من ',' of ')+d.months,nx?'<span class="'+(late?'late':'')+'">'+L('القسط الجاي ','Next due ')+dFmt(nx)+(late?L(' (عدّى)',' (overdue)'):'')+'</span>':'',esc(d.note||'')];
    } else {const late=d.due&&d.due<today;
      meta=[(lent?L('سلّفتها ','Lent '):L('اتسلفتها ','Borrowed '))+(d.date?dFmt(d.date):''),d.due?'<span class="'+(late?'late':'')+'">'+L('ميعاد الرد ','Due ')+dFmt(d.due)+(late?L(' (عدّى)',' (overdue)'):'')+'</span>':'',paid?L('اترد ','Paid back ')+money(paid)+L(' من ',' of ')+money(d.amount):'',esc(d.note||'')];
    }
    const pA=payOpen===d.id, dA=armedDebt===d.id, defPay=bank?Math.min(+d.inst||rem,rem):rem;
    const payLbl=bank?L('دفعت قسط','Paid installment'):lent?L('رجّعلي فلوس','Paid me back'):L('رجّعت فلوس','I paid back');
    return '<div class="witem"><div><div class="c">'+esc(d.person)+'</div><div class="n">'+meta.filter(Boolean).join(' · ')+'</div></div><span class="val" style="color:var('+(lent?'--in':'--out')+')">'+money(rem)+'</span>'+
      (pA?'<div class="ops payrow"><input id="payAmt" inputmode="decimal" value="'+defPay+'" aria-label="'+L('المبلغ','Amount')+'"><input type="date" id="payDate" value="'+today+'" aria-label="'+L('اليوم','Day')+'"><button type="button" class="go" data-dsave="'+esc(d.id)+'">'+L('سجّل','Save')+'</button><button type="button" data-dcancel="1">'+L('إلغاء','Cancel')+'</button></div>'
         :'<div class="ops"><button type="button" class="ed" data-dedit="'+esc(d.id)+'">'+L('تعديل','Edit')+'</button><button type="button" class="buy" data-dpay="'+esc(d.id)+'">'+payLbl+'</button><button type="button" class="'+(dA?'sure':'')+'" data-ddel="'+esc(d.id)+'">'+(dA?L('متأكدة؟','Sure?'):L('مسح','Delete'))+'</button></div>')+'</div>';
  };
  let h='';
  if(Lo.length) h+='<div class="dgroup"><h3>'+L('ليا عند الناس','Owed to me')+'</h3>'+Lo.map(item).join('')+'</div>';
  if(Bo.length) h+='<div class="dgroup"><h3>'+L('عليا للناس','I owe people')+'</h3>'+Bo.map(item).join('')+'</div>';
  if(Ko.length) h+='<div class="dgroup"><h3>'+L('قروض وتقسيط من بنوك','Bank loans & installments')+'</h3>'+Ko.map(item).join('')+'</div>';
  if(!h) h='<div class="empty">'+L('مفيش سلف أو قروض مفتوحة. سجّلي أي فلوس تسلّفيها أو تتسلفيها أو قرض من بنك عشان متتنسيش.','No open loans. Log money you lend, borrow, or owe a bank so nothing is forgotten.')+'</div>';
  if(closed.length) h+='<div class="bought"><strong style="color:var(--ink);font-weight:600">'+L('اتقفلت','Closed')+'</strong>'+closed.slice(0,6).map(d=>'<span>✓ '+esc(d.person)+' — '+M(d.amount)+' · '+(d.dir==='lent'?L('رجّعهالي','paid me back'):d.dir==='bank'?L('خلصت الأقساط','all installments paid'):L('رجّعتها','I paid back'))+'</span>').join('')+'</div>';
  const focused=document.activeElement&&document.activeElement.id;
  const kept=payOpen&&$('payAmt')?[$('payAmt').value,$('payDate').value]:null;
  $('debtList').innerHTML=h;
  if(kept&&$('payAmt')){$('payAmt').value=kept[0];$('payDate').value=kept[1];if(focused==='payAmt'||focused==='payDate')$(focused).focus()}
}

  if(dl){const id=dl.dataset.ddel;
    if(armedDebt!==id){armedDebt=id;drawDebts();setTimeout(()=>{if(armedDebt===id){armedDebt=null;drawDebts()}},3500);return}
    armedDebt=null;if(debtEdit===id)resetDebtForm();try{await delDebt(id)}catch(err){msg(L('ماتمسحتش.','Not deleted.'),true)}}
});

/* ---------- local login ---------- */
let authFails=0, authLockUntil=0, forgotArmed=false;
function authUI(){
  const isNew=$('am-new').checked, profs=getProfiles(), names=Object.keys(profs);
  $('aPin2Wrap').hidden=!isNew; $('aForgot').hidden=isNew||!names.length;
  $('aPin').autocomplete=isNew?'new-password':'current-password';
  $('aSubmit').textContent=isNew?L('اعملي الدفتر','Create book'):L('دخول','Log in');
  $('aLang').textContent=lang==='en'?'عربي':'English';
  $('authProfiles').innerHTML=(!isNew&&names.length)?'<span>'+L('دفاتر على الجهاز ده:','Books on this device:')+'</span>'+names.map(k=>'<button type="button" data-pn="'+esc(profs[k].name)+'">'+esc(profs[k].name)+'</button>').join(''):'';
  $('authNote').innerHTML=L('كل اسم ليه دفتر لوحده ورقم سري. الدفاتر دي بتتحفظ على المتصفح ده بس، فلو غيّرتي الموبايل أو مسحتي بيانات المتصفح هتضيع. اعملي «نسخة احتياطية» من وقت للتاني.','Each name has its own book and PIN. These books are saved in this browser only, so changing phones or clearing browser data loses them. Copy a backup now and then.');
}
function showAuth(){
  profile=null;loadLocal();
  document.querySelector('.app').hidden=true;document.querySelector('.tabbar').hidden=true;$('auth').hidden=false;
  $('aPin').value='';$('aPin2').value='';$('authMsg').textContent='';$('forgotBox').hidden=true;forgotArmed=false;
  const names=Object.keys(getProfiles());
  if(!names.length){$('am-new').checked=true}else{$('am-login').checked=true;let last='';try{last=localStorage.getItem('ledger-last')||''}catch(e){}if(last&&getProfiles()[last])$('aName').value=getProfiles()[last].name}
  authUI();setTimeout(()=>($('aName').value?$('aPin'):$('aName')).focus(),50);
}
function enterBook(key){
  profile=key;try{localStorage.setItem('ledger-last',key)}catch(e){}
  loadLocal();$('auth').hidden=true;document.querySelector('.app').hidden=false;document.querySelector('.tabbar').hidden=false;
  $('logoutBtn').hidden=false;$('bkBtn').hidden=false;
  resetForm();drawCats();switchTab('add');render();
}
$('am-login').addEventListener('change',()=>{$('authMsg').textContent='';authUI()});
$('am-new').addEventListener('change',()=>{$('authMsg').textContent='';authUI()});
$('aLang').addEventListener('click',()=>{setLang(lang==='en'?'ar':'en');authUI()});
$('authProfiles').addEventListener('click',e=>{const b=e.target.closest('[data-pn]');if(!b)return;$('aName').value=b.dataset.pn;$('aPin').focus()});
$('authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const am=$('authMsg'), name=$('aName').value.trim(), key=pid(name), pin=$('aPin').value.trim(), profs=getProfiles();
  if(!name){am.textContent=L('اكتبي الاسم.','Enter a name.');$('aName').focus();return}
  if(!/^\d{4,6}$/.test(pin)){am.textContent=L('الرقم السري من 4 لـ 6 أرقام.','The PIN is 4 to 6 digits.');$('aPin').focus();return}
  if($('am-new').checked){
    if(profs[key]){am.textContent=L('الاسم ده ليه دفتر خلاص. اختاري «دخول» أو اسم تاني.','That name already has a book. Choose Log in or another name.');return}
    if(pin!==$('aPin2').value.trim()){am.textContent=L('الرقمين مش زي بعض.','The PINs do not match.');$('aPin2').focus();return}
    const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    profs[key]={name,salt,hash:await hashPin(salt,pin),createdAt:Date.now()};
    if(!setProfiles(profs)){am.textContent=L('المتصفح ده مابيسمحش بالحفظ (ممكن يكون وضع تصفح خفي). جربي متصفح عادي.','This browser does not allow saving (maybe a private window). Try a normal window.');return}
    enterBook(key);msg(L('اتعمل دفترك. ابدئي سجّلي.','Your book is ready. Start logging.'));return}
  if(Date.now()<authLockUntil){am.textContent=L('استني ','Wait ')+Math.ceil((authLockUntil-Date.now())/1000)+L(' ثانية وجربي تاني.',' seconds and try again.');return}
  const p=profs[key];
  if(!p||await hashPin(p.salt,pin)!==p.hash){authFails++;if(authFails>=5){authLockUntil=Date.now()+30000;authFails=0}
    am.textContent=L('الاسم أو الرقم السري مش صح.','Name or PIN is not right.');$('aPin').value='';$('aPin').focus();return}
  authFails=0;enterBook(key);
});
$('aForgot').addEventListener('click',()=>{
  const key=pid($('aName').value||''), p=getProfiles()[key], box=$('forgotBox');box.hidden=false;
  if(!p){box.textContent=L('اكتبي اسم الدفتر الأول وبعدين دوسي تاني.','Type the book name first, then tap again.');return}
  box.innerHTML=L('الرقم السري مش متخزن في أي مكان يترجع منه. الحل الوحيد إنك تمسحي دفتر «','The PIN is not stored anywhere it can be recovered from. The only option is to delete the book “')+esc(p.name)+L('» بكل اللي فيه وتبدئي من أول.','” with everything in it and start over.')+' <button type="button" class="linkbtn danger" id="aWipe">'+L('امسحي الدفتر ده','Delete this book')+'</button>';
  forgotArmed=false;
});
$('forgotBox').addEventListener('click',e=>{
  const b=e.target.closest('#aWipe');if(!b)return;const key=pid($('aName').value||'');
  if(!forgotArmed){forgotArmed=true;b.textContent=L('متأكدة؟ دوسي تاني للمسح نهائيًا','Sure? Tap again to delete for good');return}
  const profs=getProfiles();delete profs[key];setProfiles(profs);try{localStorage.removeItem('ledger-v1:'+key)}catch(e){}
  $('aName').value='';showAuth();$('authMsg').textContent=L('اتمسح.','Deleted.');
});
$('logoutBtn').addEventListener('click',()=>{$('backup').hidden=true;$('bkBtn').setAttribute('aria-expanded','false');$('logoutBtn').hidden=true;$('bkBtn').hidden=true;showAuth()});
/* backup (local books) */
let restoreArmed=false;
$('bkBtn').addEventListener('click',()=>{const open=$('backup').hidden;$('backup').hidden=!open;$('bkBtn').setAttribute('aria-expanded',String(open));restoreArmed=false;
  $('bkNote').textContent=L('انسخي النسخة وابعتيها لنفسك في رسالة أو احفظيها في النوتس. لو الدفتر ضاع أو غيّرتي الجهاز، اعملي دفتر بنفس الاسم والصقي النسخة هنا ودوسي «استرجعي».','Copy the backup and send it to yourself or keep it in notes. If the book is lost or you change devices, create a book with the same name, paste the backup here and tap Restore.');
  $('bkRestore').textContent=L('استرجعي من النص ده','Restore from this text')});
$('bkCopy').addEventListener('click',()=>{
  const txt=JSON.stringify({app:'daftar-flousy',v:1,entries,settings,wishes,debts});
  const fallback=()=>{$('bkText').value=txt;$('bkText').focus();$('bkText').select();msg(L('النسخة في المربع. انسخيها من هناك.','The backup is in the box. Copy it from there.'))};
  try{navigator.clipboard.writeText(txt).then(()=>msg(L('اتنسخت. الصقيها في مكان آمن.','Copied. Paste it somewhere safe.')),fallback)}catch(e){fallback()}
});
$('bkRestore').addEventListener('click',()=>{
  let d;try{d=JSON.parse($('bkText').value)}catch(e){d=null}
  if(!d||!Array.isArray(d.entries)){msg(L('النص ده مش نسخة احتياطية من الدفتر.','That text is not a backup of this book.'),true);return}
  if(!restoreArmed){restoreArmed=true;$('bkRestore').textContent=L('متأكدة؟ الحركات اللي مش موجودة هتتضاف','Sure? Missing entries will be added');return}
  restoreArmed=false;
  // Merge, never replace: anything already in this book stays; only entries it does not have yet are added.
  const mergeById=(cur,inc)=>{const ids=new Set(cur.map(x=>x.id));const out=cur.slice();let n=0;(inc||[]).forEach((x,i)=>{const y=x.id?x:Object.assign({id:'r'+Date.now()+i},x);if(!ids.has(y.id)){out.push(y);ids.add(y.id);n++}});return [out,n]};
  const [ne,added]=mergeById(entries,d.entries);entries=ne;wishes=mergeById(wishes,d.wishes)[0];debts=mergeById(debts,d.debts)[0];
  const mine={};Object.keys(settings).forEach(k=>{if(JSON.stringify(settings[k])!==JSON.stringify(DEFAULTS[k])&&!(Array.isArray(settings[k])&&!settings[k].length))mine[k]=settings[k]});
  settings=migrateSettings(Object.assign({},DEFAULTS,migrateSettings(Object.assign({},d.settings||{})),mine));
  saveLocal();render();$('bkText').value='';$('bkRestore').textContent=L('استرجعي من النص ده','Restore from this text');
  msg(added?L('اتضاف '+added+' حركة، والدفتر فيه دلوقتي '+entries.length+' حركة.','Added '+added+' entries; the book now has '+entries.length+'.'):L('كل الحركات دي موجودة خلاص.','All of these entries are already here.'));
});


/* file backup (standalone build) */
$('bkDown').addEventListener('click',()=>{
  const txt=JSON.stringify({app:'daftar-flousy',v:1,entries,settings,wishes,debts});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download='daftar-flousy-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  msg(L('الملف نزل. احفظيه في مكان آمن.','Backup file downloaded. Keep it somewhere safe.'));
});
$('bkFile').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
  $('bkText').value=await f.text();e.target.value='';restoreArmed=true;$('bkRestore').click();});

/* ---------- boot ---------- */
$('pals').insertAdjacentHTML('afterbegin',PALS.map(p=>'<button type="button" data-p="'+p.id+'" style="background:linear-gradient(135deg,'+p.bg+' 50%,'+p.ac+' 50%)"></button>').join(''));
$('pals').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b)return;applyPal(b.dataset.p);putSettings({palette:b.dataset.p}).catch(()=>{})});
$('palBtn').addEventListener('click',()=>{const open=$('pals').hidden;$('pals').hidden=!open;$('palBtn').setAttribute('aria-expanded',String(open))});
$('langBtn').addEventListener('click',()=>{setLang(lang==='en'?'ar':'en');putSettings({lang}).catch(()=>{})});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
(function(){let p='navywine';try{p=localStorage.getItem('ledger-pal')||'navywine'}catch(e){}curPal=p})();
$('date').value=iso(new Date());$('dDate').value=iso(new Date());$('bStart').value=ymOf(new Date());
applyStatic();
drawCats();
const h0=(location.hash||'').slice(1);
switchTab(['add','month','money','plans','log'].includes(h0)?h0:'add',true);
init();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
